<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administração - Demandas</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="administracao.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="js/dados-exemplo.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/utils.js" defer></script>
<script src="js/navbar.js" defer></script>
<script src="js/administracao.js" defer></script>
</head>
<body class="bg-body-tertiary">

<div id="navbar" data-ativo="administracao"></div>

  <main class="container-xxl pt-4 pb-5">

    <div class="mb-4">
      <h1 class="h2 fw-bold mb-1">Administração</h1>
      <p class="text-secondary mb-0">Cadastro de usuários e definição das equipes de cada projeto.</p>
    </div>

    <div id="mensagem"></div>

    <ul class="nav nav-tabs mb-4" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="aba-usuarios" data-bs-toggle="tab" data-bs-target="#painel-usuarios"
                type="button" role="tab" aria-controls="painel-usuarios" aria-selected="true">Usuários</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="aba-equipes" data-bs-toggle="tab" data-bs-target="#painel-equipes"
                type="button" role="tab" aria-controls="painel-equipes" aria-selected="false">Equipes dos projetos</button>
      </li>
    </ul>

    <div class="tab-content">

      <!-- ================= Usuários ================= -->
      <div class="tab-pane fade show active" id="painel-usuarios" role="tabpanel" aria-labelledby="aba-usuarios">

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <p class="text-secondary mb-0" id="contadorUsuarios"></p>
          <button type="button" id="botaoNovoUsuario" class="btn btn-primary">+ Novo usuário</button>
        </div>

        <div class="card shadow-sm">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th scope="col">Nome</th>
                  <th scope="col">Perfil</th>
                  <th scope="col">Projetos</th>
                  <th scope="col">Situação</th>
                  <th scope="col" class="text-end">Ações</th>
                </tr>
              </thead>
              <tbody id="corpoUsuarios"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="tab-pane fade" id="painel-equipes" role="tabpanel" aria-labelledby="aba-equipes">
        <div class="row g-3">

          <div class="col-lg-4">
            <div class="card shadow-sm h-100">
              <div class="card-body">
                <h2 class="secao-titulo">Projeto</h2>
                <select class="form-select mb-2" id="selecaoProjeto" aria-label="Projeto"></select>
                <div class="form-text">
                  O Líder de Projeto é o usuário com perfil <strong>Líder</strong> vinculado ao projeto.
                </div>
              </div>
            </div>
          </div>

          <div class="col-lg-8">
            <div class="card shadow-sm h-100">
              <div class="card-body">
                <h2 class="secao-titulo">Equipe</h2>
                <div id="avisoLider"></div>

                <div class="row g-2 mb-3">
                  <div class="col-sm-8">
                    <select class="form-select" id="selecaoUsuario" aria-label="Usuário a adicionar"></select>
                  </div>
                  <div class="col-sm-4">
                    <button type="button" id="botaoVincular" class="btn btn-primary w-100">Adicionar à equipe</button>
                  </div>
                </div>

                <div id="listaMembros"></div>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <div class="modal fade" id="modalUsuario" tabindex="-1" aria-labelledby="tituloUsuario" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <form id="formularioUsuario" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="tituloUsuario">Novo usuário</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>

          <div class="modal-body">
            <div id="mensagemModal"></div>

            <div class="mb-3">
              <label for="campoNome" class="form-label">Nome completo *</label>
              <input type="text" class="form-control" id="campoNome" maxlength="120" required>
            </div>

            <div class="mb-3">
              <label for="campoEmail" class="form-label">E-mail *</label>
              <input type="email" class="form-control" id="campoEmail" maxlength="160" required>
              <div class="form-text">Será usado como login do usuário.</div>
            </div>

            <div class="mb-3">
              <label for="campoSenha" class="form-label" id="rotuloSenha">Senha *</label>
              <input type="password" class="form-control" id="campoSenha" maxlength="100" autocomplete="new-password">
              <div class="form-text" id="avisoSenha">Mínimo de 6 caracteres.</div>
            </div>

            <div class="mb-3">
              <label for="campoPerfil" class="form-label">Perfil de acesso *</label>
              <select class="form-select" id="campoPerfil" required></select>
            </div>

            <div class="form-check" id="blocoAtivo" hidden>
              <input class="form-check-input" type="checkbox" id="campoAtivo" checked>
              <label class="form-check-label" for="campoAtivo">Usuário ativo (pode acessar o sistema)</label>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" id="botaoSalvarUsuario" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
