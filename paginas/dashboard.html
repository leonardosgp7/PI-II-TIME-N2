<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Demandas</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/dashboard.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="js/dados-exemplo.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/utils.js" defer></script>
<script src="js/navbar.js" defer></script>
<script src="js/dashboard.js" defer></script>
</head>
<body class="bg-body-tertiary">

<div id="navbar" data-ativo="dashboard"></div>

  <main class="container-xxl pt-4 pb-5">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <div>
        <h1 class="h2 fw-bold mb-1">Dashboard</h1>
        <p class="text-secondary mb-0" id="subtitulo">Carregando demandas...</p>
      </div>
      <a href="demandas.html" class="btn btn-primary">Ver todas as demandas</a>
    </div>

    <div id="mensagem"></div>

    <section class="mb-4">
      <h2 class="secao-titulo">Demandas por status</h2>
      <!-- preenchido por mostrarIndicadoresStatus() em js/dashboard.js -->
      <div class="row row-cols-2 row-cols-md-3 row-cols-lg-6 g-3" id="indicadoresStatus"></div>
    </section>

    <div class="row g-3 mb-4">
      <div class="col-lg-6">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="secao-titulo">Demandas por prioridade</h2>
            <div id="graficoPrioridade"></div>
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="secao-titulo">Demandas por tipo</h2>
            <div id="graficoTipo"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-6">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="secao-titulo">Demandas críticas em aberto</h2>
            <div id="listaCriticas"></div>
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="secao-titulo">Próximas do prazo (7 dias) ou atrasadas</h2>
            <div id="listaPrazo"></div>
          </div>
        </div>
      </div>
    </div>

  </main>

</body>
</html>
