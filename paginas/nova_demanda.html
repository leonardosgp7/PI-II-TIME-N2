<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/navbar.css">
    <link href="nova_demanda.css" rel="stylesheet">
    <script src="js/dados-exemplo.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/navbar.js" defer></script>
    <title>Nova Demandas - Demandas</title>
    <meta name="viewport" content="width=device-width" initial-scale="1">
    <script src="nova_demanda.js" defer></script>
</head>
<body>
<div id="navbar" data-ativo="demandas"></div>

    <div class="subtitulo">
        <div class="Dashboard">
            <p>Dashboard</p>
        </div>
        <div class="barra">
            <p>/</p>
        </div>
        <div class="Demandas">
            <p>Demandas</p>
        </div>
        <div class="barra">
            <p>/</p>
        </div>
        <div class="Novademanda">
            <p>Nova demanda</p>
        </div>
    </div>

    <div class="novademanda">
    <h1>Nova demanda</h1>
    </div>
    <div class="subnova">
        <p>Toda demanda é criada com o status Aberta e pode ser editada depois pela tela de detalhes</p>
    </div>
    <form id="formulario">
        <div class="campo">
        <label for="titulo">Título<sup>*</sup></label>
        <input id="titulo" type="text" name="titulo" placeholder="Digite o título de demanda">
        <div id="erroTitulo" class="invalid-feedback"></div>
        </div>

        <div class="campo">
        <label for="descricao">Descrição</label>
        <textarea id="descricao" rows="5" name="descricao" placeholder="Descreva detalhadamente a demanda..."></textarea>
        <div id="erroDescricao" class="invalid-feedback"></div>
        </div>

        <div class="linha">

            <div class="campo">
                <label for="projeto">Projeto<sup>*</sup></label>
                    <select id="projeto">
                        <option value="">Selecione o projeto</option>
                        <option value="projeto">Empresarial</option>
                        <option value="projeto">Base</option>
                        <option value="projeto">Colegial</option>
                    </select>
                <div id="erroProjeto" class="invalid-feedback"></div>
                <p>O projeto não pode ser alterado após a criação</p>
            </div>

            <div class="campo">
                <label for="responsavel">Responsável<sup></sup></label>
                    <select id="responsavel">
                        <option value="">Selecione um responsável...</option>
                        <option value="responsavel">Ana</option>
                        <option value="responsavel">Vittor</option>
                        <option value="responsavel">Maurício</option>
                    </select>
               <div id=erroResponsavel class="invalid-feedback"></div> 
               <p>Pode ser atribuído posteriormente</p>
            </div>
        </div>

        <div class="linha">

            <div class="campo">
                <label for="tipo">Tipo<sup>*</sup></label>
                <select id="tipo">
                    <option value="">Selecione um tipo...</option>
                    <option value="tipo">Projeto</option>
                    <option value="tipo">Tarefa</option>
                    <option value="tipo">Trabalho</option>
                </select>
                <div id="erroTipo" class="invalid-feedback"></div>
            </div>

            <div class="campo">
                <label for="prioridade">Prioridade<sup>*</sup></label>
                <select id="prioridade">
                    <option value="">Selecione uma prioridade...</option>
                    <option value="prioridade">Fácil</option>
                    <option value="prioridade">Média</option>
                    <option value="prioridade">Difícil</option>
                </select>
                <div id="erroPrioridade" class="invalid-feedback"></div>
            </div>

            <div class="campo">
            <label for="data">Prazo de finalização<sup></sup></label>
            <input id="data" type="date" name="data">
            <div id="erroData" class="invalid-feedback"></div>
            </div>
        </div>

        <div class="subtext">
            <p>Feriados nacionais não serão aceitos.</p>
        </div>

            <hr>
            <div class="botoes">
                <button type="reset" class="botaocancelar">Cancelar</button>
                <button type="submit" class="botaocadastro">Cadastrar demanda</button>
            </div>
    </form>
</body>
</html>
