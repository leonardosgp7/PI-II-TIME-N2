<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova Demanda - Demandas</title>

    <!-- Bootstrap primeiro; seus CSS depois, para poderem sobrescrever -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/navbar.css">
    <link href="nova_demanda.css" rel="stylesheet">

    <script src="js/dados-exemplo.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/navbar.js" defer></script>
    <script src="js/nova_demanda.js" defer></script>
</head>
<body>
    <div id="navbar" data-ativo="demandas"></div>

    <main class="container py-4" style="max-width: 900px;">

        <!-- Caminho de navegação -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">Dashboard</li>
                <li class="breadcrumb-item">Demandas</li>
                <li class="breadcrumb-item active" aria-current="page">Nova demanda</li>
            </ol>
        </nav>

        <h1 class="h2">Nova demanda</h1>
        <p class="text-muted mb-4">
            Toda demanda é criada com o status Aberta e pode ser editada depois pela tela de detalhes
        </p>

        <form id="formulario" novalidate>

            <div class="mb-3">
                <label for="titulo" class="form-label">Título<sup>*</sup></label>
                <input id="titulo" type="text" name="titulo" class="form-control"
                       placeholder="Digite o título de demanda">
                <div id="erroTitulo" class="invalid-feedback"></div>
            </div>

            <div class="mb-3">
                <label for="descricao" class="form-label">Descrição<sup>*</sup></label>
                <textarea id="descricao" name="descricao" rows="5" class="form-control"
                          placeholder="Descreva detalhadamente a demanda..."></textarea>
                <div id="erroDescricao" class="invalid-feedback"></div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="projeto" class="form-label">Projeto<sup>*</sup></label>
                    <select id="projeto" name="projeto" class="form-select">
                        <option value="">Selecione o projeto</option>
                        <option value="empresarial">Empresarial</option>
                        <option value="base">Base</option>
                        <option value="colegial">Colegial</option>
                    </select>
                    <div id="erroProjeto" class="invalid-feedback"></div>
                    <div class="form-text">O projeto não pode ser alterado após a criação</div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="responsavel" class="form-label">Responsável<sup>*</sup></label>
                    <select id="responsavel" name="responsavel" class="form-select">
                        <option value="">Selecione um responsável...</option>
                        <option value="ana">Ana</option>
                        <option value="vittor">Vittor</option>
                        <option value="mauricio">Maurício</option>
                    </select>
                    <div id="erroResponsavel" class="invalid-feedback"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="tipo" class="form-label">Tipo<sup>*</sup></label>
                    <select id="tipo" name="tipo" class="form-select">
                        <option value="">Selecione um tipo...</option>
                        <option value="projeto">Projeto</option>
                        <option value="tarefa">Tarefa</option>
                        <option value="trabalho">Trabalho</option>
                    </select>
                    <div id="erroTipo" class="invalid-feedback"></div>
                </div>

                <div class="col-md-4 mb-3">
                    <label for="prioridade" class="form-label">Prioridade<sup>*</sup></label>
                    <select id="prioridade" name="prioridade" class="form-select">
                        <option value="">Selecione uma prioridade...</option>
                        <option value="facil">Fácil</option>
                        <option value="media">Média</option>
                        <option value="dificil">Difícil</option>
                    </select>
                    <div id="erroPrioridade" class="invalid-feedback"></div>
                </div>

                <div class="col-md-4 mb-3">
                    <label for="data" class="form-label">Prazo de finalização<sup>*</sup></label>
                    <input id="data" type="date" name="data" class="form-control">
                    <div id="erroData" class="invalid-feedback"></div>
                    <div class="form-text">Feriados nacionais não serão aceitos.</div>
                </div>
            </div>

            <hr>

            <div class="d-flex justify-content-end gap-2">
                <button type="reset" class="btn btn-outline-secondary">Cancelar</button>
                <button type="submit" class="btn btn-primary">Cadastrar demanda</button>
            </div>
        </form>
    </main>
</body>
</html>
