<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Demandas - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- O Bootstrap (CSS e ícones) é importado dentro do style.css -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="bg-login min-vh-100 d-flex align-items-center justify-content-center p-3">

    <main class="login-card card border-0 shadow-lg rounded-4 w-100 p-4 p-sm-5">

        <h1 class="titulo-sistema fs-2 fw-bold border-start border-5 ps-3 mb-4">SISTEMA DE DEMANDAS</h1>
        <h2 class="titulo-pagina fs-4 fw-semibold text-center mb-2">PÁGINA DE LOGIN</h2>
        <p class="subtitulo-pagina text-center mb-4">Projeto Integrador II - Engenharia de Software</p>

        <form id="formLogin" action="/login" method="POST" novalidate>

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email</label>
                <div class="campo input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="username"
                           placeholder="Coloque seu email" autocomplete="username" required>
                    <div class="invalid-feedback" id="erroEmail">Informe seu email.</div>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Senha</label>
                <div class="campo input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Coloque sua senha" autocomplete="current-password" required>
                    <div class="invalid-feedback">Informe sua senha.</div>
                </div>
            </div>

            <button type="submit" id="btnLogin" class="btn btn-login w-100 mb-4">
                <span id="btnSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
                <span id="btnTexto">Login</span>
            </button>

            <p class="esqueci text-center mb-0">
                Esqueceu sua senha? <a href="#">esqueci minha senha</a>
            </p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
