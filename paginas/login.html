<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Demandas - Demandas</title>
     <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="container">
        <h1 class="titulo-sistemas">Sistema de Demandas</h1>
        <h2 class = "titulo-pagina">Pagina de Login</h2>
        <p class="subtitulo-pagina">Projeto Integrador II -Engenharia de Software</p>
        <form action="/login" method="POST">
            <label for="username">Usuário</label>
            <input type="text" id="username" placeholder="Coloque seu usuário" name="username" required>
            <br>
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="Coloque sua senha" name="password" required>
            <br>
            <button type="submit">Login</button>
        </form>
        <p class="esqueci">Esqueceu sua senha? <a href="/forgot-password">esqueci minha senha</a></p>

    </main>
</body>
</html>
