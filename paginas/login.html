<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Demandas - Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
    <main class="container">
        <h1 class="titulo-sistemas">SISTEMA DE DEMANDAS</h1>
        <h2 class = "titulo-pagina">PAGINA DE LOGIN</h2>
        <p class="subtitulo-pagina">PROJETO INTEGRADOR II - ENGENHERIA DE SOFTWARE</p>
        <form action="/login" method="POST">
            <label for="username">USUARIO</label>
            <input type="text" id="username" placeholder="Insira seu usuário" name="username" required>
            <br>
            <label for="password">SENHA</label>
            <input type="password" id="password" placeholder="Insira sua senha" name="password" required>
            <br>
            <button type="submit">LOGIN</button>
        </form>

    </main>
</body>
</html>
