<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Demanda - Demandas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/navbar.css">
    <link href="css/editar_demanda.css" rel="stylesheet">

    <script src="js/dados-exemplo.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/navbar.js" defer></script>
    <script src="js/editar_demanda.js" defer></script>
</head>
<body>
    <div id="navbar" data-ativo="demandas"></div>

    <main class="container py-4" style="max-width: 900px;">

        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
                <li class="breadcrumb-item"><a href="demandas.html">Demandas</a></li>
                <li class="breadcrumb-item"><a id="linkDemanda" href="demandas.html">Demanda</a></li>
                <li class="breadcrumb-item active" aria-current="page">Editar</li>
            </ol>
        </nav>

        <h1 class="h2">Editar demanda</h1>
        <p class="text-muted mb-4" id="subtitulo">Carregando demanda...</p>

        <div id="mensagem"></div>

        <form id="formulario" novalidate hidden>

            <div class="mb-3">
                <label for="titulo" class="form-label">Título<sup>*</sup></label>
                <input id="titulo" type="text" name="titulo" class="form-control"
                       placeholder="Digite o título de demanda">
                <div id="erroTitulo" class="invalid-feedback"></div>
            </div>

            <div class="mb-3">
                <label for="descricao" class="form-label">Descrição</label>
                <textarea id="descricao" name="descricao" rows="5" class="form-control"
                          placeholder="Descreva detalhadamente a demanda..."></textarea>
                <div id="erroDescricao" class="invalid-feedback"></div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="projeto" class="form-label">Projeto</label>
                    <input id="projeto" type="text" class="form-control" disabled>
                    <div class="form-text">O projeto não pode ser alterado após a criação</div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="responsavel" class="form-label">Responsável</label>
                    <select id="responsavel" name="responsavel" class="form-select">
                        <option value="">Sem responsável</option>
                    </select>
                    <div id="erroResponsavel" class="invalid-feedback"></div>
                    <div class="form-text" id="avisoResponsavel"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="prioridade" class="form-label">Prioridade<sup>*</sup></label>
                    <select id="prioridade" name="prioridade" class="form-select"></select>
                    <div id="erroPrioridade" class="invalid-feedback"></div>
                    <div class="form-text" id="avisoPrioridade"></div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="prazo" class="form-label">Prazo de finalização</label>
                    <input id="prazo" type="date" name="prazo" class="form-control">
                    <div id="erroPrazo" class="invalid-feedback"></div>
                    <div class="form-text">Feriados nacionais não serão aceitos.</div>
                </div>
            </div>

            <hr>

            <div class="d-flex justify-content-end gap-2">
                <a id="botaoCancelar" class="btn btn-outline-secondary" href="demandas.html">Cancelar</a>
                <button type="submit" class="btn btn-primary">Salvar alterações</button>
            </div>
        </form>
    </main>
</body>
</html>
