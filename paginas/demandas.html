<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demandas - Demandas</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/demandas.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="js/dados-exemplo.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/utils.js" defer></script>
<script src="js/navbar.js" defer></script>
<script src="js/demandas.js" defer></script>
</head>
<body class="bg-body-tertiary">

<div id="navbar" data-ativo="demandas"></div>

  <main class="container-xxl pt-4 pb-5">

    <!-- ===== Título da página ===== -->
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
      <div>
        <h1 class="h2 fw-bold mb-1">Demandas</h1>
        <p class="text-secondary mb-0" id="contador">Carregando demandas...</p>
      </div>

      <a href="nova_demanda.html" class="btn btn-primary fw-semibold">+ Nova demanda</a>
    </div>

    <div id="mensagem"></div>

    <!-- ===== Filtros ===== -->
    <form id="filtros" class="card shadow-sm mb-4">
      <div class="card-body">

        <div class="row g-3">
          <div class="col-12 col-md-6 col-lg-4">
            <label for="buscar" class="form-label fw-semibold">Buscar</label>
            <input type="search" class="form-control" id="buscar" name="q" placeholder="Título ou descrição">
          </div>

          <div class="col-6 col-md-3 col-lg-2">
            <label for="status" class="form-label fw-semibold">Status</label>
            <select class="form-select" id="status" name="status"></select>
          </div>

          <div class="col-6 col-md-3 col-lg-2">
            <label for="prioridade" class="form-label fw-semibold">Prioridade</label>
            <select class="form-select" id="prioridade" name="prioridade"></select>
          </div>

          <div class="col-6 col-md-3 col-lg-2">
            <label for="tipo" class="form-label fw-semibold">Tipo</label>
            <select class="form-select" id="tipo" name="tipo"></select>
          </div>

          <div class="col-6 col-md-3 col-lg-2">
            <label for="projeto" class="form-label fw-semibold">Projeto</label>
            <select class="form-select" id="projeto" name="projeto"></select>
          </div>
        </div>

        <div class="row g-3 mt-0 align-items-end">
          <div class="col-12 col-md-4 col-lg-3">
            <label for="responsavel" class="form-label fw-semibold">Responsável</label>
            <select class="form-select" id="responsavel" name="responsavel"></select>
          </div>

          <div class="col-12 col-md-4 col-lg-3">
            <label for="ordenar" class="form-label fw-semibold">Ordenar por</label>
            <select class="form-select" id="ordenar" name="ordenar">
              <option value="dataCriacao">Data de criação</option>
              <option value="prazo">Prazo</option>
              <option value="prioridade">Prioridade</option>
            </select>
          </div>

          <div class="col-12 col-md-4 col-lg-2">
            <label for="direcao" class="form-label fw-semibold">Direção</label>
            <select class="form-select" id="direcao" name="direcao">
              <option value="decrescente">Decrescente</option>
              <option value="crescente">Crescente</option>
            </select>
          </div>

          <div class="col-12 col-lg-2">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="minhas" name="minhas">
              <label class="form-check-label text-secondary small" for="minhas">
                Somente minhas demandas
              </label>
            </div>
          </div>

          <div class="col-12 col-lg-2 d-grid d-lg-block text-lg-end">
            <button type="reset" class="btn btn-outline-secondary">Limpar filtros</button>
          </div>
        </div>

      </div>
    </form>

    <!-- ===== Tabela ===== -->
    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0 tabela-demandas">
          <caption class="visually-hidden">Lista de demandas</caption>
          <thead class="table-light">
            <tr>
              <th scope="col" class="coluna-id">#</th>
              <th scope="col">Título</th>
              <th scope="col">Tipo</th>
              <th scope="col">Prioridade</th>
              <th scope="col">Status</th>
              <th scope="col">Projeto</th>
              <th scope="col">Responsável</th>
              <th scope="col">Criada em</th>
              <th scope="col">Prazo</th>
            </tr>
          </thead>
          <tbody id="corpoDemandas"></tbody>
        </table>
      </div>
    </div>

  </main>

</body>
</html>
